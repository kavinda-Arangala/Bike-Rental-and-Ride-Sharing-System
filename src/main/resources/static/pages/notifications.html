<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Notifications | BikeShare</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{app:{bg:'#0f0f0f',card:'#1a1a1a',side:'#111111',border:'#2a2a2a',accent:'#00d4aa',primary:'#f0f0f0',secondary:'#9ca3af',muted:'#6b7280'}}}}}</script></head>
<body><script src="../js/utils.js"></script><script>
requireAuth();
renderAppShell('notifications','Notifications','Read, delete, broadcast, and inspect notifications.');
let notifications = [], adminNotifications = [], filter = 'ALL';
const root = document.getElementById('pageContent');
root.innerHTML = `
  <section id="adminNotify" class="mb-6 hidden rounded-lg border border-app-border bg-app-card p-5"><div class="mb-4 flex flex-wrap items-center justify-between gap-3"><h2 class="text-lg font-bold">Admin Notifications</h2><div class="flex gap-2"><button id="openSend" class="${buttonClass()}">Send Notification</button><button id="loadAllNotifications" class="${buttonClass('ghost')}">Load All</button></div></div><div id="adminNotificationList" class="grid gap-4 xl:grid-cols-2"></div></section>
  <div class="mb-5 flex flex-wrap items-center justify-between gap-3"><div class="flex gap-2"><button data-filter="ALL" class="filter rounded-lg border border-app-accent bg-app-accent px-4 py-2 text-sm font-bold text-black">All</button><button data-filter="UNREAD" class="filter rounded-lg border border-app-border px-4 py-2 text-sm text-app-secondary">Unread</button></div><div class="flex gap-2"><button id="loadUnread" class="${buttonClass('ghost')}">Load Unread API</button><button id="readAll" class="${buttonClass()}">Mark all as read</button></div></div>
  <section id="list" class="space-y-4"></section>
  ${modalShell('sendNotificationModal','Send Notification',`<form id="sendNotificationForm" class="space-y-4"><input name="userId" type="number" class="${inputClass()}" placeholder="User ID (blank = all users)"><input name="title" class="${inputClass()}" placeholder="Title" required><textarea name="message" rows="4" class="${inputClass()}" placeholder="Message" required></textarea><select name="channel" class="${inputClass()}" required><option>IN_APP</option><option>EMAIL</option><option>BOTH</option></select><button class="${buttonClass()}">Send</button></form>`)}
`;
if (getUserRole() === 'ADMIN') adminNotify.classList.remove('hidden');
function notificationCard(n, admin = false) {
  return `<article class="rounded-lg border border-app-border ${n.read ? 'bg-app-card' : 'bg-app-accent/10'} p-5"><div class="flex items-start gap-3"><span class="mt-2 h-2.5 w-2.5 rounded-full ${n.read ? 'bg-app-muted' : 'bg-app-accent'}"></span><div class="flex-1"><div class="flex flex-wrap items-start justify-between gap-3"><div><h2 class="font-bold">${escapeHtml(n.title || 'Notification')}</h2><p class="mt-1 text-xs text-app-muted">${escapeHtml(n.type || '')} ${escapeHtml(n.channel || '')} ${admin ? '- User #' + escapeHtml(n.userId || '') : ''}</p></div><span class="text-xs text-app-muted">${formatDate(n.createdAt)}</span></div><div class="mt-2 text-sm text-app-secondary">${n.message || ''}</div><div class="mt-4 flex flex-wrap gap-2">${!admin && !n.read ? `<button data-read="${n.id}" class="${buttonClass()}">Mark as read</button>` : ''}${!admin ? `<button data-delete="${n.id}" class="${buttonClass('danger')}">Delete</button>` : ''}</div></div></div></article>`;
}
function render() { const items = filter === 'UNREAD' ? notifications.filter(n => !n.read) : notifications; list.innerHTML = items.length ? items.map(n => notificationCard(n)).join('') : emptyState('No notifications in this view.'); if (getUserRole() === 'ADMIN') adminNotificationList.innerHTML = adminNotifications.length ? adminNotifications.map(n => notificationCard(n, true)).join('') : emptyState('Admin notifications not loaded yet.'); }
async function load(path = '/api/notifications/my') { try { notifications = listFrom(await apiFetch(path)); render(); updateUnreadBadge(); } catch(e) { showToast(e.message,'error'); } }
async function loadAdmin() { try { adminNotifications = listFrom(await apiFetch('/api/notifications/admin/all')); render(); } catch(e) { showToast(e.message,'error'); } }
document.addEventListener('click', async event => { try { if (event.target.dataset.filter) { filter = event.target.dataset.filter; document.querySelectorAll('.filter').forEach(btn => btn.className = `filter rounded-lg border px-4 py-2 text-sm ${btn.dataset.filter === filter ? 'border-app-accent bg-app-accent font-bold text-black' : 'border-app-border text-app-secondary'}`); render(); } if (event.target.dataset.read) { await apiFetch(`/api/notifications/${event.target.dataset.read}/read`, { method:'PATCH' }); showToast('Notification marked as read.'); load(); } if (event.target.dataset.delete) { await apiFetch(`/api/notifications/${event.target.dataset.delete}`, { method:'DELETE' }); showToast('Notification deleted.'); load(); } if (event.target.id === 'readAll') { await apiFetch('/api/notifications/read-all', { method:'PATCH' }); showToast('All notifications marked as read.'); load(); } if (event.target.id === 'loadUnread') { filter = 'UNREAD'; await load('/api/notifications/my/unread'); } if (event.target.id === 'openSend') openModal('sendNotificationModal'); if (event.target.id === 'loadAllNotifications') loadAdmin(); } catch(e) { showToast(e.message,'error'); } });
if (getUserRole() === 'ADMIN') {
  sendNotificationForm.addEventListener('submit', async event => { event.preventDefault(); const body = Object.fromEntries(new FormData(event.target)); if (!body.userId) delete body.userId; else body.userId = Number(body.userId); try { await apiFetch('/api/notifications/admin/send', { method:'POST', body: JSON.stringify(body) }); closeModal('sendNotificationModal'); event.target.reset(); showToast('Notification sent.'); loadAdmin(); } catch(e) { showToast(e.message,'error'); } });
}
load();
</script></body></html>
